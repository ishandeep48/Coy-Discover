services:
  coy-discover:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coy-discover-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - CURRENT_USER_ID=current_user
    volumes:
      # Persist the mutable runtime JSON across container lifecycles
      - ./Backend/data:/app/Backend/data
